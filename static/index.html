<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0e">
  <title>It's a Wonderful App</title>
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/js/main.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="#/" class="brand" id="brand-link"><h1 class="brand-name">It's a Wonderful App</h1></a>
      <div class="header-actions">
        <a href="#/settings" class="icon-btn icon-btn-quiet" id="settings-btn" aria-label="Settings">&#9881;&#xFE0E;</a>
        <button type="button" class="icon-btn" id="add-btn" aria-label="Add a movie">+</button>
      </div>
    </div>
  </header>

  <main id="view">
    <section id="grid-view">
      <section class="continue" id="continue" aria-labelledby="continue-title" hidden>
        <h2 class="section-title" id="continue-title">Continue Watching</h2>
        <div class="continue-row" id="continue-row"></div>
      </section>
      <h2 class="section-title">Our Christmas movies</h2>
      <section class="surprise" id="surprise" aria-label="Surprise us">
        <button type="button" class="btn surprise-btn" id="surprise-btn">🎲 Surprise us, ya filthy animals</button>
        <div class="chips" id="surprise-chips" role="group" aria-label="Filters for the surprise"></div>
        <p class="surprise-status" id="surprise-status" aria-live="polite"></p>
        <div class="grid surprise-picks" id="surprise-picks"></div>
        <button type="button" class="btn btn-quiet surprise-again" id="surprise-again" hidden>Keep the change (pick again)</button>
      </section>
      <form id="search-form" class="search-form" role="search">
        <label class="sr-only" for="search-input">Search our list by title, actor or series</label>
        <input type="search" id="search-input" class="field" enterkeyhint="search" autocomplete="off"
               placeholder="Search title, actor or series">
      </form>
      <p class="search-status" id="search-status" aria-live="polite"></p>
      <div class="grid" id="grid" aria-label="Movies on our list"></div>
      <p class="empty" id="grid-empty">Loading…</p>
      <section class="suggest" id="suggest" aria-labelledby="suggest-title" hidden>
        <h3 class="suggest-title" id="suggest-title">Not on our list yet</h3>
        <div id="suggest-list"></div>
      </section>
    </section>
    <section id="detail-view" hidden>
      <a href="#/" class="back-link" id="back-link">&larr; Our list</a>
      <div id="detail"></div>
    </section>
    <section id="settings-view" hidden>
      <a href="#/" class="back-link" id="settings-back">&larr; Our list</a>
      <div id="settings"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>It's a Wonderful App: the family Christmas movie picker</p>
    <p class="tmdb-credit"><img src="/static/tmdb.svg" alt="TMDB" width="64" height="12">
      <span>This product uses the TMDB API but is not endorsed or certified by TMDB.</span></p>
    <p>Where-to-watch data from JustWatch.</p>
  </footer>

  <div id="toast" class="toast-container" role="status" aria-live="polite"></div>
</body>
</html>
